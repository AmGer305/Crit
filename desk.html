<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Randnotiz Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: the desk sister of Randnotiz. A sticky bar with filters; the whole chapter on the left,
   each handwritten note pinned in the margin at the height of its passage, like comments in a manuscript. */
:root{
  --paper:#ECEEEA; --page:#F8F9F6; --ink:#1D2230; --muted:#677083; --line:#D3D7DF;
  --accent:#2846A8; --accent-ink:#FFFFFF; --accent-soft:rgba(40,70,168,.10);
  --ink-k:#191C24; --ink-b:#2846A8;
  --hl-g:rgba(70,165,82,.30); --hl-r:rgba(222,70,70,.25); --hl-y:rgba(236,188,28,.38); --hl-p:rgba(214,166,30,.38); --hl-w:rgba(128,22,36,.30);
  --dot-g:#3E9A4B; --dot-r:#D04545; --dot-y:#C2950C; --dot-p:#B8890F; --dot-w:#8B1E2D;
  --chip:#E2E5EC; --chip-on:#1D2230; --chip-on-ink:#F8F9F6;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 20px rgba(20,24,40,.08);
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-rev:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",serif;
  --f-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111318; --page:#171A20; --ink:#E3E5EA; --muted:#98A0AE; --line:#2A2F3A;
  --accent:#93A8F4; --accent-ink:#0E1220; --accent-soft:rgba(147,168,244,.14);
  --ink-k:#ECEEF2; --ink-b:#A3B6FF;
  --hl-g:rgba(98,192,108,.28); --hl-r:rgba(240,98,98,.28); --hl-y:rgba(238,198,60,.28); --hl-p:rgba(232,190,70,.28); --hl-w:rgba(214,84,104,.30);
  --dot-g:#6CC277; --dot-r:#F07373; --dot-y:#E5C24A; --dot-p:#E3BC4E; --dot-w:#D9607A;
  --chip:#262A33; --chip-on:#E3E5EA; --chip-on-ink:#171A20;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111318; --page:#171A20; --ink:#E3E5EA; --muted:#98A0AE; --line:#2A2F3A;
  --accent:#93A8F4; --accent-ink:#0E1220; --accent-soft:rgba(147,168,244,.14);
  --ink-k:#ECEEF2; --ink-b:#A3B6FF;
  --hl-g:rgba(98,192,108,.28); --hl-r:rgba(240,98,98,.28); --hl-y:rgba(238,198,60,.28); --hl-p:rgba(232,190,70,.28); --hl-w:rgba(214,84,104,.30);
  --dot-g:#6CC277; --dot-r:#F07373; --dot-y:#E5C24A; --dot-p:#E3BC4E; --dot-w:#D9607A;
  --chip:#262A33; --chip-on:#E3E5EA; --chip-on-ink:#171A20;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:1240px;margin:0 auto;display:grid;gap:8px}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 260px}
.brand b{font-family:var(--f-read);font-style:italic;font-weight:600;font-size:1.25rem;white-space:nowrap}
.brand span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.btn{border:1px solid var(--line);background:var(--page);border-radius:8px;padding:6px 12px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.hint-keys{color:var(--muted);font-size:.8rem}
.filters{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;min-height:28px;display:inline-flex;align-items:center;gap:6px;font-size:.84rem;line-height:1}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 30vh}
.desk{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,400px);gap:36px;align-items:start}
.desk.cards-only{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.desk{grid-template-columns:minmax(0,1fr)}}
.banner{max-width:40em;margin:0 0 18px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);line-height:1.45;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 16em}

.text{background:var(--page);border:1px solid var(--line);border-radius:12px;padding:32px 36px 48px 72px;min-width:0;
  font-family:var(--f-read);font-size:1.12rem;line-height:1.75;max-width:44em}
.text.rev{font-family:var(--f-rev);line-height:2}
.text h2{font-weight:600;font-size:1.3em;line-height:1.3;margin:0 0 1em;text-wrap:balance;position:relative}
.text p{margin:0;text-indent:1.5em;position:relative}
.text p.first{text-indent:0}
.text p.center{text-align:center;text-indent:0;margin-block:.8em}
.pn{position:absolute;left:-58px;width:38px;text-align:right;top:.35em;font-family:var(--f-ui);font-size:.66rem;color:var(--muted);opacity:.6;
  text-indent:0;line-height:1.2;font-variant-numeric:tabular-nums;font-style:normal}
.w.em{font-style:italic}
.h{background:var(--hlc);cursor:pointer;transition:background .15s}
.h.c-g{--hlc:var(--hl-g)} .h.c-r{--hlc:var(--hl-r)} .h.c-y{--hlc:var(--hl-y)} .h.c-p{--hlc:var(--hl-p)} .h.c-w{--hlc:var(--hl-w)}
.h.hs{border-top-left-radius:4px;border-bottom-left-radius:4px}
.h.he{border-top-right-radius:4px;border-bottom-right-radius:4px}
.h.act{box-shadow:0 2px 0 var(--accent)}
.h.fade{background:transparent;cursor:default}
@media (max-width:560px){.text{padding:20px 16px 32px 46px}.pn{left:-40px;width:30px}}

.margin{position:relative;min-width:0}
.card{background:var(--page);border:1px solid var(--line);border-left:4px solid var(--cc,var(--line));border-radius:10px;padding:10px 12px;
  display:grid;gap:6px;box-shadow:var(--shadow);width:100%;box-sizing:border-box;text-align:left;transition:top .2s ease,box-shadow .15s}
.wide .card{position:absolute;left:0;right:0}
.narrow .card{margin-bottom:10px}
.card.c-g{--cc:var(--dot-g)} .card.c-r{--cc:var(--dot-r)} .card.c-y{--cc:var(--dot-y)} .card.c-p{--cc:var(--dot-p)} .card.c-w{--cc:var(--dot-w)}
.card.act{outline:2px solid var(--accent);outline-offset:1px}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.78rem;color:var(--muted)}
.card .cats{display:flex;flex-wrap:wrap;gap:4px}
.card .cats span{font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--chip)}
.card .cats span.priv{background:var(--dot-r);color:#fff}
.card canvas{display:block;max-width:100%}
.card .none{color:var(--muted);font-style:italic;font-family:var(--f-read);margin:0}
.card .tools{display:flex;gap:8px;justify-content:flex-end}
.link{background:none;border:0;padding:2px 0;color:var(--accent);font-size:.8rem;text-decoration:underline;text-underline-offset:3px}
.card q{font-family:var(--f-read);font-style:italic;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.groups{display:grid;gap:22px}
.groups h3{margin:0 0 10px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.groups .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}

.drop{position:fixed;inset:0;z-index:20;background:var(--accent-soft);border:3px dashed var(--accent);display:grid;place-items:center;
  font-family:var(--f-read);font-size:1.4rem;color:var(--ink);pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chip-on);color:var(--chip-on-ink);
  padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.card,.h{transition:none}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="row1">
      <div class="brand"><b>Randnotiz Desk</b><span id="docLabel"></span></div>
      <span class="hint-keys">&uarr; &darr; step through notes</span>
      <button class="btn primary" type="button" id="openBtn">Open sheet</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>

<div class="wrap">
  <div class="banner" id="sampleBanner" hidden>
    <p>This is an example. Open a sheet you saved from Randnotiz, or drop it anywhere on this page, to see your own chapter with your notes in the margin.</p>
    <button class="btn primary" type="button" id="bannerOpen">Open sheet</button>
  </div>
  <main class="desk" id="desk">
    <article class="text" id="text" aria-label="Chapter text"></article>
    <aside class="margin" id="margin" aria-label="Your notes"></aside>
  </main>
</div>

<div class="drop" id="drop" hidden>Drop your Randnotiz sheet</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="fileIn" accept=".html,.htm" hidden>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const COL={g:'Works',r:'Trips me',y:'Noticed',p:'Protect',w:'Needs work'};
const NIB_PX=3.9;
let S=null,isSample=false,wordEls=[],spEls=[],wordTxt=[],wordPara=[],spAfter=[],active=null,filter=null,cardEls=new Map();

const dr=x=>Array.isArray(x.drawers)?x.drawers:(x.drawer?[x.drawer]:[]);
const catLabel=c=>c==='Loose thoughts'?'☁️ Loose thoughts':c==='Love'?'♥ Love':c;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

/* ---------- reading a sheet ---------- */
function sessionFrom(html){
  const d=new DOMParser().parseFromString(html,'text/html');const el=d.getElementById('randnotiz-session');
  if(!el)return null;try{return JSON.parse(el.textContent)}catch(e){return null}
}
function migrate(s){
  s.highlights=s.highlights||[];s.chapterNote=s.chapterNote||{strokes:[]};s.cards=s.cards||[];s.paras=s.paras||[];s.mode=s.mode||'critique';
  if(!s.v||s.v<2){const conv=st=>{st.pts=st.pts.map(p=>[p[0]*500,p[1]*500])};s.highlights.forEach(h=>(h.strokes||[]).forEach(conv));s.chapterNote.strokes.forEach(conv);s.v=2}
  return s;
}
async function openFile(f){
  if(!f)return;
  const s=sessionFrom(await f.text());
  if(!s){toast('That file isn’t a Randnotiz sheet. Open the .html you saved with Save sheet.');return}
  isSample=false;load(s);store.set('rnd:last',JSON.stringify(s));window.scrollTo(0,0);
}
$('#openBtn').addEventListener('click',()=>$('#fileIn').click());
$('#bannerOpen').addEventListener('click',()=>$('#fileIn').click());
$('#fileIn').addEventListener('change',e=>{openFile(e.target.files[0]);e.target.value=''});
let dragN=0;
document.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragN++;$('#drop').hidden=false}});
document.addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)$('#drop').hidden=true});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();dragN=0;$('#drop').hidden=true;const f=e.dataTransfer.files[0];if(f)openFile(f)});

/* ---------- ink (same italic nib as Randnotiz) ---------- */
function samplesOf(pts){
  if(pts.length<2)return pts.slice();const out=[pts[0]];
  const lin=(a,b)=>{const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/1.1));for(let k=1;k<=n;k++){const t=k/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}};
  if(pts.length===2){lin(pts[0],pts[1]);return out}
  for(let i=1;i<pts.length-1;i++){const s=out[out.length-1],c=pts[i],m=[(c[0]+pts[i+1][0])/2,(c[1]+pts[i+1][1])/2];
    const n=Math.max(2,Math.ceil((Math.hypot(c[0]-s[0],c[1]-s[1])+Math.hypot(m[0]-c[0],m[1]-c[1]))/1.1));
    for(let k=1;k<=n;k++){const t=k/n,u=1-t;out.push([u*u*s[0]+2*u*t*c[0]+t*t*m[0],u*u*s[1]+2*u*t*c[1]+t*t*m[1]])}}
  lin(out[out.length-1],pts[pts.length-1]);return out;
}
function drawStroke(c,st,color,ox,oy){
  const pts=st.pts.map(p=>[p[0]-ox,p[1]-oy]);
  const w=NIB_PX*(st.nib||1),th=(st.ang||40)*Math.PI/180,hx=Math.cos(th)*w/2,hy=-Math.sin(th)*w/2;
  c.fillStyle=color;c.strokeStyle=color;const s=samplesOf(pts),n=s.length;
  if(n===1){c.beginPath();c.moveTo(s[0][0]+hx,s[0][1]+hy);c.lineTo(s[0][0]-hx,s[0][1]-hy);c.lineWidth=Math.max(1.2,w*.45);c.lineCap='round';c.stroke();return}
  const tp=i=>{const e=Math.min(i,n-1-i);return e>=5?1:.62+.38*e/5};
  c.beginPath();
  for(let i=0;i<n-1;i++){const a=s[i],b=s[i+1],ta=tp(i),tb=tp(i+1);
    const A1=[a[0]+hx*ta,a[1]+hy*ta],A2=[a[0]-hx*ta,a[1]-hy*ta],B1=[b[0]+hx*tb,b[1]+hy*tb],B2=[b[0]-hx*tb,b[1]-hy*tb];
    const area=(B1[0]-A1[0])*(A2[1]-A1[1])-(B1[1]-A1[1])*(A2[0]-A1[0]);const q=area<0?[A1,A2,B2,B1]:[A1,B1,B2,A2];
    c.moveTo(q[0][0],q[0][1]);c.lineTo(q[1][0],q[1][1]);c.lineTo(q[2][0],q[2][1]);c.lineTo(q[3][0],q[3][1]);c.closePath()}
  c.fill('nonzero');c.lineWidth=Math.max(.9,w*.17);c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(s[0][0],s[0][1]);for(let i=1;i<n;i++)c.lineTo(s[i][0],s[i][1]);c.stroke();
}
function inkCanvas(strokes,maxW){
  let x0=Infinity,y0=Infinity,x1=0,y1=0;
  strokes.forEach(s=>s.pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])}));
  const pad=8,ox=x0-pad,oy=y0-pad,w=x1-x0+pad*2,h=y1-y0+pad*2,sc=Math.min(1,maxW/w),dpr=Math.min(window.devicePixelRatio||1,2.5);
  const cv=document.createElement('canvas');cv.width=Math.ceil(w*sc*dpr);cv.height=Math.ceil(h*sc*dpr);cv.style.width=Math.round(w*sc)+'px';cv.style.height=Math.round(h*sc)+'px';
  cv.setAttribute('role','img');cv.setAttribute('aria-label','Handwritten note');
  const x=cv.getContext('2d');x.setTransform(dpr*sc,0,0,dpr*sc,0,0);
  strokes.forEach(st=>drawStroke(x,st,css(st.ink==='b'?'--ink-b':'--ink-k'),ox,oy));
  cv._strokes=strokes;cv._maxW=maxW;return cv;
}

/* ---------- text ---------- */
function renderText(){
  const box=$('#text');box.textContent='';box.classList.toggle('rev',S.mode==='revise');
  wordEls=[];spEls=[];wordTxt=[];wordPara=[];spAfter=[];let firstBody=true;
  S.paras.forEach((p,pi)=>{
    const el=document.createElement(p.type==='h'?'h2':'p');
    if(p.type==='c')el.className='center';else if(p.type==='p'&&firstBody)el.className='first';
    if(p.type==='p')firstBody=false;if(p.type==='h')firstBody=true;
    const pn=document.createElement('span');pn.className='pn';pn.textContent=pi+1;pn.setAttribute('aria-hidden','true');el.appendChild(pn);
    const startCount=wordEls.length;
    p.runs.forEach(r=>r.t.split(/(\s+)/).forEach(part=>{
      if(!part)return;
      if(/^\s+$/.test(part)){if(wordEls.length===startCount)return;const s=document.createElement('span');s.className='sp';s.textContent=' ';const a=wordEls.length-1;spEls[a]=s;spAfter[a]=true;el.appendChild(s)}
      else{const w=document.createElement('span');w.className='w'+(r.em?' em':'');w.textContent=part;wordEls.push(w);wordTxt.push(part);wordPara.push(pi);spAfter.push(false);el.appendChild(w)}
    }));
    box.appendChild(el);
  });
}
function quoteOf(h){let s='';for(let k=h.start;k<=h.end&&k<wordTxt.length;k++){s+=wordTxt[k];if(k<h.end){if(wordPara[k+1]!==wordPara[k])s+=' / ';else if(spAfter[k])s+=' '}}return s}
function matches(h){if(!filter)return true;if(filter.t==='col')return h.color===filter.v;const d=dr(h);return filter.v===null?!d.length:d.includes(filter.v)}
function paint(){
  document.querySelectorAll('#text .h').forEach(el=>{el.className=el.classList.contains('em')?'w em':(el.classList.contains('sp')?'sp':'w');delete el.dataset.h});
  S.highlights.slice().sort((a,b)=>(a.created||0)-(b.created||0)).forEach(h=>{
    const on=matches(h);
    for(let k=h.start;k<=h.end;k++){const w=wordEls[k];if(!w)continue;
      const add=el=>{el.classList.add('h','c-'+h.color);if(!on)el.classList.add('fade');if(h.id===active)el.classList.add('act');el.dataset.h=h.id};
      add(w);if(k===h.start)w.classList.add('hs');if(k===h.end)w.classList.add('he');
      if(k<h.end&&spEls[k]&&wordPara[k+1]===wordPara[k])add(spEls[k]);}
  });
}
$('#text').addEventListener('click',e=>{const el=e.target.closest('.h');if(el&&!el.classList.contains('fade'))activate(el.dataset.h,'text')});

/* ---------- margin notes ---------- */
function cardFor(h,isChapter){
  const c=document.createElement('div');c.className='card'+(isChapter?'':' c-'+h.color);c.tabIndex=0;c.dataset.h=isChapter?'__chapter':h.id;
  const meta=document.createElement('div');meta.className='meta';
  meta.textContent=isChapter?'Whole chapter':('¶ '+(wordPara[h.start]+1)+' · '+(COL[h.color]||''));
  c.appendChild(meta);
  if(!isChapter&&dr(h).length){const cats=document.createElement('div');cats.className='cats';
    dr(h).forEach(d=>{const s=document.createElement('span');s.textContent=catLabel(d);if(d==='Private')s.className='priv';cats.appendChild(s)});c.appendChild(cats)}
  const strokes=h.strokes||[];
  if(strokes.length)c.appendChild(inkCanvas(strokes,360));
  else{const p=document.createElement('p');p.className='none';p.textContent='No handwritten note.';c.appendChild(p)}
  if(!isChapter){const tools=document.createElement('div');tools.className='tools';const b=document.createElement('button');b.type='button';b.className='link';b.textContent='Copy quote';
    b.addEventListener('click',ev=>{ev.stopPropagation();const q=quoteOf(h);
      (navigator.clipboard?navigator.clipboard.writeText(q):Promise.reject()).then(()=>toast('Quote copied. Paste it into the doc’s search to find the spot.'),()=>toast(q))});
    tools.appendChild(b);c.appendChild(tools);
    c.addEventListener('click',()=>activate(h.id,'card'));c.addEventListener('keydown',e=>{if(e.key==='Enter')activate(h.id,'card')});}
  return c;
}
function renderMargin(){
  const m=$('#margin');m.textContent='';cardEls=new Map();
  if((S.chapterNote.strokes||[]).length){const c=cardFor(S.chapterNote,true);m.appendChild(c);cardEls.set('__chapter',c)}
  S.highlights.slice().sort((a,b)=>a.start-b.start).forEach(h=>{const c=cardFor(h,false);m.appendChild(c);cardEls.set(h.id,c)});
  if(!m.children.length){const p=document.createElement('p');p.className='none';p.style.color='var(--muted)';p.textContent='No highlights in this sheet.';m.appendChild(p)}
}
function layout(){
  if(!S||S.mode==='notes')return;
  const m=$('#margin'),wide=window.matchMedia('(min-width: 981px)').matches;
  m.classList.toggle('wide',wide);m.classList.toggle('narrow',!wide);
  if(!wide){m.style.height='';cardEls.forEach(c=>c.style.top='');return}
  const mTop=m.getBoundingClientRect().top;
  const items=[];
  cardEls.forEach((c,id)=>{if(c.hidden)return;let want=0;
    if(id!=='__chapter'){const h=S.highlights.find(x=>x.id===id);const w=wordEls[h.start];want=w?w.getBoundingClientRect().top-mTop-10:0}
    items.push({c,id,want})});
  items.sort((a,b)=>a.want-b.want);
  const act=items.findIndex(i=>i.id===active);
  const tops=new Array(items.length);let y=0;
  items.forEach((it,i)=>{tops[i]=Math.max(it.want,y);y=tops[i]+it.c.offsetHeight+10});
  if(act>0&&tops[act]>items[act].want){ // pull the active note up to its passage, push earlier ones above it
    tops[act]=Math.max(0,items[act].want);let lim=tops[act];
    for(let i=act-1;i>=0;i--){const h=items[i].c.offsetHeight+10;tops[i]=Math.min(tops[i],lim-h);lim=tops[i]}
    if(tops[0]<0){const sh=-tops[0];for(let i=0;i<=act;i++)tops[i]+=sh}
    y=tops[act]+items[act].c.offsetHeight+10;
    for(let i=act+1;i<items.length;i++){tops[i]=Math.max(items[i].want,y);y=tops[i]+items[i].c.offsetHeight+10}
  }
  items.forEach((it,i)=>it.c.style.top=tops[i]+'px');
  m.style.height=y+'px';
}
function applyFilter(){
  paint();
  cardEls.forEach((c,id)=>{if(id==='__chapter'){c.hidden=!!filter;return}const h=S.highlights.find(x=>x.id===id);c.hidden=!matches(h)});
  layout();
}

/* ---------- active note ---------- */
function visibleOrder(){return S.highlights.filter(matches).sort((a,b)=>a.start-b.start).map(h=>h.id)}
function activate(id,from){
  active=id;paint();cardEls.forEach((c,k)=>c.classList.toggle('act',k===id));layout();
  const h=S.highlights.find(x=>x.id===id);if(!h)return;
  if(from!=='text'){const w=wordEls[h.start];if(w){const r=w.getBoundingClientRect();window.scrollTo({top:window.scrollY+r.top-160,behavior:'smooth'})}}
}
document.addEventListener('keydown',e=>{
  if(!S||S.mode==='notes'||e.target.closest('input,textarea'))return;
  const k=e.key;if(!['ArrowDown','ArrowUp','j','k'].includes(k))return;
  const ids=visibleOrder();if(!ids.length)return;e.preventDefault();
  let i=ids.indexOf(active);i=(k==='ArrowDown'||k==='j')?Math.min(ids.length-1,i+1):Math.max(0,i<0?0:i-1);activate(ids[i],'key');
});

/* ---------- filters ---------- */
function renderFilters(){
  const f=$('#filters');f.textContent='';
  const items=S.mode==='notes'?S.cards.filter(c=>c.strokes&&c.strokes.length):S.highlights;
  if(!items.length)return;
  const lab=document.createElement('span');lab.className='lbl';lab.textContent='Show';f.appendChild(lab);
  const mk=(label,count,f2,dot)=>{const b=document.createElement('button');b.type='button';b.className='chip';
    if(dot){const i=document.createElement('i');i.style.background='var(--dot-'+dot+')';b.appendChild(i)}
    b.appendChild(document.createTextNode(label));if(count!=null){const n=document.createElement('b');n.textContent=count;b.appendChild(n)}
    const on=f2===null?!filter:filter&&filter.t===f2.t&&filter.v===f2.v;b.setAttribute('aria-pressed',String(!!on));
    b.addEventListener('click',()=>{filter=f2&&!(filter&&filter.t===f2.t&&filter.v===f2.v)?f2:null;renderFilters();applyFilter()});f.appendChild(b)};
  if(S.mode==='notes')return;
  mk('All',items.length,null);
  const cols={};items.forEach(h=>cols[h.color]=(cols[h.color]||0)+1);
  Object.keys(COL).forEach(c=>{if(cols[c])mk(COL[c],cols[c],{t:'col',v:c},c)});
  const cats=new Map();let none=0;items.forEach(h=>{const d=dr(h);if(!d.length)none++;d.forEach(x=>cats.set(x,(cats.get(x)||0)+1))});
  cats.forEach((n,c)=>mk(catLabel(c),n,{t:'cat',v:c}));
  if(none&&cats.size)mk('No category',none,{t:'cat',v:null});
}

/* ---------- letter-notes sheets (no text) ---------- */
function renderNotes(){
  const t=$('#text');t.textContent='';t.hidden=true;$('#margin').hidden=true;
  let g=document.getElementById('groups');if(!g){g=document.createElement('div');g.id='groups';g.className='groups';$('#desk').appendChild(g)}
  g.hidden=false;g.textContent='';
  const cards=S.cards.filter(c=>c.strokes&&c.strokes.length),order=[];
  cards.forEach(c=>{const d=dr(c);(d.length?d:[null]).forEach(x=>{if(!order.includes(x))order.push(x)})});
  order.sort((a,b)=>(a==='Private')-(b==='Private')||(a===null)-(b===null)||(a==='Loose thoughts')-(b==='Loose thoughts'));
  order.forEach(k=>{const sec=document.createElement('section');const h=document.createElement('h3');
    const list=cards.filter(c=>k===null?!dr(c).length:dr(c).includes(k));h.textContent=(k===null?'Not filed':catLabel(k))+' · '+list.length;sec.appendChild(h);
    const grid=document.createElement('div');grid.className='grid';
    list.forEach(c=>{const el=document.createElement('div');el.className='card';const m=document.createElement('div');m.className='meta';
      m.textContent='Card '+(S.cards.indexOf(c)+1)+(dr(c).length>1?' · also in '+dr(c).filter(x=>x!==k).map(catLabel).join(', '):'');el.appendChild(m);
      el.appendChild(inkCanvas(c.strokes,340));grid.appendChild(el)});
    sec.appendChild(grid);g.appendChild(sec)});
  if(!order.length){const p=document.createElement('p');p.className='none';p.textContent='No filed thoughts in this sheet.';g.appendChild(p)}
}

/* ---------- load ---------- */
function load(s){
  S=migrate(s);active=null;filter=null;
  $('#sampleBanner').hidden=!isSample;
  $('#docLabel').textContent=(isSample?'Example: ':'')+[S.docTitle,S.mode==='notes'?'letter notes':S.chapterTitle].filter(Boolean).join(' · ')+(S.mode==='revise'?' · revision':'');
  const notes=S.mode==='notes';$('#desk').classList.toggle('cards-only',notes);
  const g=document.getElementById('groups');if(g)g.hidden=true;
  $('#text').hidden=false;$('#margin').hidden=false;
  renderFilters();
  if(notes){renderNotes();return}
  renderText();paint();renderMargin();
  requestAnimationFrame(()=>requestAnimationFrame(layout));
}
window.addEventListener('resize',()=>layout());
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());
const reInk=()=>{document.querySelectorAll('.card canvas').forEach(cv=>{const n=inkCanvas(cv._strokes,cv._maxW);cv.replaceWith(n)});layout()};
const mq=window.matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',reInk);
new MutationObserver(reInk).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- example ---------- */
function scribble(x0,y0,len,seed){const pts=[];for(let t=0;t<=len;t+=3){const a=t/9+seed;pts.push([x0+t,y0-11*Math.abs(Math.sin(a))-3*Math.sin(a*2.3)])}return pts}
function note(lines,seed){const st=[];for(let i=0;i<lines;i++)st.push({ink:'k',nib:1,ang:40,pts:scribble(10,40+i*48,220+((i*53+seed*31)%90),seed+i)});return st}
function example(){
  const P=t=>({type:'p',runs:[{t,em:false}]});
  return {v:2,mode:'critique',docTitle:'Pride and Prejudice',chapterTitle:'Chapter 1',
    paras:[{type:'h',runs:[{t:'Chapter 1',em:false}]},
      P('It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.'),
      P('However little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families, that he is considered the rightful property of some one or other of their daughters.'),
      P('“My dear Mr. Bennet,” said his lady to him one day, “have you heard that Netherfield Park is let at last?”'),
      P('Mr. Bennet replied that he had not.'),
      P('“But it is,” returned she; “for Mrs. Long has just been here, and she told me all about it.”'),
      P('Mr. Bennet made no answer.'),
      P('“Do you not want to know who has taken it?” cried his wife impatiently.'),
      P('“You want to tell me, and I have no objection to hearing it.”'),
      P('This was invitation enough.')],
    highlights:[
      {id:'e1',start:2,end:7,color:'g',drawers:['Love','Prose'],strokes:note(2,1),created:1},
      {id:'e2',start:44,end:53,color:'y',drawers:['Character'],strokes:note(1,4),created:2},
      {id:'e3',start:81,end:84,color:'r',drawers:['Prose'],strokes:note(2,7),created:3}],
    chapterNote:{strokes:note(1,9)},cards:[]};
}

let saved=null;try{saved=JSON.parse(store.get('rnd:last')||'null')}catch(e){}
if(saved){isSample=false;load(saved)}else{isSample=true;load(example())}
})();
